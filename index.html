<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Downloader - Tudo em Um</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 550px;
            text-align: center;
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover { background-color: var(--primary-hover); }

        #result {
            margin-top: 1.5rem;
            display: none;
        }

        .download-btn {
            background-color: #10b981;
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px;
        }
        
        .download-btn:hover { background-color: #059669; }

        .media-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Multi Downloader Pro</h1>
        <p>Baixe Vídeos e Fotos do TikTok, Instagram, YouTube e Pinterest</p>

        <div class="input-group">
            <input type="text" id="mediaUrl" placeholder="Cole o link aqui (Vídeo, Foto ou Carrossel)..." required>
            <button id="btnAnalyse" onclick="processMedia()">Analisar Link</button>
        </div>

        <div id="result">
            <p style="color: #10b981; font-weight: bold;">✓ Mídia encontrada!</p>
            <div id="downloadArea" class="media-box"></div>
        </div>
    </div>

    <script>
        // Configurado diretamente com o seu link real obtido da Pipedream
        const PIPEDREAM_URL = "https://pipedream.net";

        async function processMedia() {
            const urlInput = document.getElementById('mediaUrl').value.trim();
            const btn = document.getElementById('btnAnalyse');
            const resultDiv = document.getElementById('result');
            const downloadArea = document.getElementById('downloadArea');

            if (!urlInput) {
                alert('Por favor, insira um link.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando mídia...";
            resultDiv.style.display = "none";
            downloadArea.innerHTML = "";

            try {
                const response = await fetch(`${PIPEDREAM_URL}?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();
                
                if (data && data.success) {
                    if (data.type === "video") {
                        downloadArea.innerHTML = `<a href="${data.downloadUrl}" target="_blank" class="download-btn">Baixar Vídeo MP4</a>`;
                    } else if (data.type === "images" && data.urls.length > 0) {
                        data.urls.forEach((imgUrl, index) => {
                            downloadArea.innerHTML += `<a href="${imgUrl}" target="_blank" class="download-btn">Baixar Imagem ${index + 1}</a>`;
                        });
                    }
                    resultDiv.style.display = "block";
                } else {
                    alert("Erro ao extrair mídia. Verifique se o link está correto e público.");
                }
            } catch (error) {
                alert("Erro de comunicação com o motor global. Tente novamente.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Analisar Link";
            }
        }
    </script>
</body>
</html>
