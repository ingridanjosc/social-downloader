<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multi Downloader Pro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #030712;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 630px;
            padding: 38px 40px;
            text-align: center;
            background: #0b101b;
            border: 1px solid #111827;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin-bottom: 14px;
            font-size: 34px;
            color: #4f46e5;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 16px;
            color: #ffffff;
            background: #030712;
            border: 1px solid #273244;
            border-radius: 9px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.18);
        }

        button,
        .download-btn {
            width: 100%;
            padding: 16px;
            color: #ffffff;
            background: #1d4ed8;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover,
        .download-btn:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
            transform: none;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding-top: 22px;
            border-top: 1px solid #1f2937;
        }

        .success-message {
            margin-bottom: 16px;
            color: #10b981;
            font-weight: bold;
        }

        .media-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .download-btn {
            display: block;
            text-decoration: none;
        }

        .error-message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            color: #fecaca;
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.4);
            border-radius: 9px;
            line-height: 1.4;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Multi Downloader Pro</h1>

        <p class="subtitle">
            Baixe vídeos e fotos do TikTok, Instagram, YouTube e Pinterest
        </p>

        <div class="input-group">
            <input
                type="url"
                id="mediaUrl"
                placeholder="Cole o link aqui..."
                required
            >

            <button id="btnAnalyse" type="button" onclick="processMedia()">
                Analisar Link
            </button>
        </div>

        <p id="errorMessage" class="error-message"></p>

        <section id="result">
            <p class="success-message">✓ Mídia encontrada!</p>
            <div id="downloadArea" class="media-box"></div>
        </section>
    </main>

    <script>
        const PIPEDREAM_URL =
            "https://eo6sqe16yqjy32l.m.pipedream.net";

        async function processMedia() {
            const input = document.getElementById("mediaUrl");
            const button = document.getElementById("btnAnalyse");
            const result = document.getElementById("result");
            const downloadArea = document.getElementById("downloadArea");
            const errorMessage = document.getElementById("errorMessage");

            const mediaUrl = input.value.trim();

            result.style.display = "none";
            errorMessage.style.display = "none";
            errorMessage.textContent = "";
            downloadArea.innerHTML = "";

            if (!mediaUrl) {
                showError("Cole o link de um vídeo ou imagem.");
                return;
            }

            try {
                new URL(mediaUrl);
            } catch {
                showError("O endereço informado não parece ser um link válido.");
                return;
            }

            button.disabled = true;
            button.textContent = "Processando mídia...";

            try {
                const requestUrl =
                    `${PIPEDREAM_URL}?url=${encodeURIComponent(mediaUrl)}`;

                const response = await fetch(requestUrl, {
                    method: "GET",
                    headers: {
                        Accept: "application/json"
                    }
                });

                const responseText = await response.text();

                let data;

                try {
                    data = JSON.parse(responseText);
                } catch {
                    throw new Error(
                        "O Pipedream não devolveu uma resposta válida."
                    );
                }

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        data.error ||
                        "O Pipedream não conseguiu processar esse link."
                    );
                }

                if (data.success && data.type === "video" && data.downloadUrl) {
                    createDownloadButton(
                        data.downloadUrl,
                        "Baixar vídeo MP4"
                    );

                    result.style.display = "block";
                    return;
                }

                if (
                    data.success &&
                    data.type === "images" &&
                    Array.isArray(data.urls) &&
                    data.urls.length > 0
                ) {
                    data.urls.forEach((imageUrl, index) => {
                        createDownloadButton(
                            imageUrl,
                            `Baixar imagem ${index + 1}`
                        );
                    });

                    result.style.display = "block";
                    return;
                }

                throw new Error(
                    data.message ||
                    data.error ||
                    "Não foi possível encontrar a mídia. Confira se o link é público."
                );
            } catch (error) {
                console.error("Erro no downloader:", error);

                showError(
                    error.message ||
                    "Não foi possível se comunicar com o Pipedream."
                );
            } finally {
                button.disabled = false;
                button.textContent = "Analisar Link";
            }
        }

        function createDownloadButton(url, text) {
            const downloadArea = document.getElementById("downloadArea");
            const link = document.createElement("a");

            link.href = url;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.className = "download-btn";
            link.textContent = text;

            downloadArea.appendChild(link);
        }

        function showError(message) {
            const errorMessage = document.getElementById("errorMessage");

            errorMessage.textContent = message;
            errorMessage.style.display = "block";
        }

        document
            .getElementById("mediaUrl")
            .addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    processMedia();
                }
            });
    </script>
</body>
</html>
