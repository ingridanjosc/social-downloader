<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Downloader - Sem Marca d'Água</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            padding: 14px;
            border-radius: 8px;
            border: 2px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary-color);
        }

        button {
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.5rem;
            display: none;
        }

        .download-btn {
            background-color: #10b981;
            display: inline-block;
            text-decoration: none;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .download-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Social Downloader</h1>
        <p>Baixe vídeos das redes sociais sem marca d'água gratuitamente</p>

        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Cole o link do vídeo aqui (TikTok, Instagram...)" required>
            <button id="btnDownload" onclick="processVideo()">Analisar Vídeo</button>
        </div>

        <div id="result">
            <p style="color: #10b981;">✓ Vídeo processado com sucesso!</p>
            <a id="downloadLink" href="#" target="_blank" class="download-btn">Clique aqui para Baixar MP4</a>
        </div>
    </div>

    <script>
        // BACKEND_URL será a URL do seu servidor no Render futuramente
        const BACKEND_URL = "https://onrender.com";

        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value;
            const btn = document.getElementById('btnDownload');
            const resultDiv = document.getElementById('result');

            if (!urlInput) {
                alert('Por favor, insira um link válido.');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Processando vídeo...";
            resultDiv.style.display = "none";

            try {
                // Código real que vai conectar ao backend na Fase 2
                /*
                const response = await fetch(`${BACKEND_URL}?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();
                if(data.success) {
                    document.getElementById('downloadLink').href = data.downloadUrl;
                    resultDiv.style.display = "block";
                } else { alert("Erro ao processar link."); }
                */

                // Simulação temporária para você ver o visual funcionando no GitHub:
                await new Promise(resolve => setTimeout(resolve, 2000));
                document.getElementById('downloadLink').href = urlInput; // Apenas simulação
                resultDiv.style.display = "block";

            } catch (error) {
                alert('Erro ao conectar ao servidor de download.');
            } finally {
                btn.disabled = false;
                btn.innerText = "Analisar Vídeo";
            }
        }
    </script>
</body>
</html>
